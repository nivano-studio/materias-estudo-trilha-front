<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox</title>
    <style>
      .item {
        font-family: "Courier New", Courier, monospace;
        margin: 5px;
        border: 2px solid;
        border-radius: 5px;
        padding: 3px;
        width: 20px;
        height: 20px;
        text-align: center;
        font-weight: 700;
      }
      .cubo {
        margin: 20px;
        border: 2px solid;
        border-radius: 5px;
        width: 200px;
        height: 200px;
        display: block;
        width: 300px;
        height: 160px;
        display: in;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <div class="cubo">
      <div class="item">1</div>
      <div class="item">2</div>
      <div class="item">3</div>
    </div>
  </body>
</html>
