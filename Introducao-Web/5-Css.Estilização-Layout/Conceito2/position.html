<!DOCTYPE html>
<html lang="pt-BR">

<!--
$  color <- cor do texto
$  font-family <- fonte
$  font-size: <- tamnho do texto
$  font-weight <- grozura do texto
$  text-align <- alinhamento do texto
-->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            font-family: 'Courier New', Courier, monospace;
            background-color: lightgray;
            /* $ Altura*/
            height: 30px;
            /* $ Largura*/
            width: 30px;
            /* $ Espaçamento entre as caixa*/
            margin: 10px;
            /* $ Espaçamento interno entre a caixa e o conteudo */
            padding: 5px;
            /* # Ele respeita o tamnho do height e width. Atribuição feita dependendo do padding, Pois quando adicionado um valor(px), é aumentado o tamnho da caixa(height e width)*/
            /* # padding: topo/base(px) esqueda e direita(px45);*/
            box-sizing: border-box;
            /* $ Bordas*/
            border: 3px black solid;
            /* $ valores da border: tamnho, cor e tipo*/
            /* # Tipos: double, solid, dashed, dotted*/
            /* $ Arredondar Bordas */
            border-radius: 7px;
        }
    </style>
</head>

<body>
    <div>1</div>
    <div style="position: relative; left: 10px;">2</div>
    <div>3</div>
</body>

</html>
