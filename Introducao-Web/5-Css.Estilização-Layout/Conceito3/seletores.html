<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- $ Seletores e Classes-->
     <style>
        h1 {
            color:brown;
        }
        p {
            font-weight: 700;
            color: blanchedalmond
        }
        .aviso { font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;}
        .bordacaixa {border: 3px solid crimson; border-radius: 20px;}
        .paddingcaixa {padding: 14px;}
        .destaque {background-color: black;}
        .fontbig {font-size: 13px}
        #Whatsapp {
          border-radius: 20px;
          border-bottom: white;
          background-color: brown;
          transition: 0.3s;
        }
        #Whatsapp:hover {
          background-color: coral;
          transform: translateY(-6px);
        }
        footer a {
          color: brown;
        }
     </style>
  </head>
  <body>
    <h1 class="aviso"> Pagamento Pendete! </h1>
    <div class="bordacaixa paddingcaixa destaque fontbig">
        <p>Entre em, contato para definir forma de Pagamento</p>
        <button type="button" id="Whatsapp">Whatsapp</button>
    </div>
  </body>
  <footer>
    <br>
    <br>
    Canais
    <a href="">contato@Nivano.com.br</a>
  </footer>
</html>
