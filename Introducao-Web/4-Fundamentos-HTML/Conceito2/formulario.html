<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>

<body>
    <!-- 
        action: para onde sera enviado
        method: Enviar para o Url
        submit: Responsavel por enviar o forumulario
        -->
    <form action="" method="get">
        <label>Informe seu Nome: </label>
        <input type="text" name="NameUser" id="" placeholder="Campo Nome">
        <br>
        <label>Informe seu Email: </label>
        <input type="email" name="MailUser" id="" placeholder="Campo Email">
        <br>

        <button type="submit">Enviar</button>
    </form>
    <br>
</body>

</html>
