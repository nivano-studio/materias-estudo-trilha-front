<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisar Google</title>
</head>

<body>
    <!-- 
        action: para onde sera enviado
        method: Enviar para o Url
        submit: Responsavel por enviar o forumulario
        -->
    <form action="https://www.google.com/search" method="get">
        <label>Sobre o que você deseja saber? </label>
        <input type="text" name="q" id="">
        <br>
        <br>
        <button type="submit">Pesquisar no Google</button>
    </form>
    <br>
</body>
<footer>
    Desenvolvido por José
</footer>

</html>
